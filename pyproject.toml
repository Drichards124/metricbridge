[project]
name = "metricbridge"
version = "0.1.0"
description = "A semantic firewall between autonomous agents and enterprise data warehouses"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "mcp>=2.2",
    "sqlglot>=30",
    "duckdb>=1.5",
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = ["pytest>=8.2", "ruff>=0.6", "hypothesis>=6.140"]

[project.scripts]
metricbridge = "metricbridge.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/metricbridge"]

[tool.ruff]
line-length = 100
extend-exclude = ["spike"]

[tool.ruff.lint]
# E501 keeps error messages and docstrings wrapped: long lines hide what a diff changed.
extend-select = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Inline YAML fixtures read worse split across lines than run long.
"tests/test_manifest_invalid.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The SDK moves fast (FastMCP -> MCPServer, logging deprecated). Fail on its deprecations rather
# than discovering them in a release.
filterwarnings = ["error::mcp.shared.exceptions.MCPDeprecationWarning"]
