id: trailing_12m_revenue_by_month
catalog: storefront
request:
  metric: trailing_12m_revenue
  date_range: {start_date: "2026-01-01", end_date: "2026-09-30"}
  time_grain: month
# trailing_12m_revenue: for each month, recognised revenue over the twelve months ending with it.
# March 2026 has no revenue of its own and still has a trailing total.
reference_sql: |
  WITH anchors AS (
    SELECT CAST(generate_series AS DATE) AS period
    FROM generate_series(DATE '2026-01-01', DATE '2026-09-01', INTERVAL 1 MONTH)
  )
  SELECT anchors.period, SUM(r.amount) AS trailing_12m_revenue
  FROM anchors
  JOIN billing.fct_subscription_revenue_daily r
    ON r.revenue_date >= anchors.period + INTERVAL 1 MONTH - INTERVAL 12 MONTH
   AND r.revenue_date < anchors.period + INTERVAL 1 MONTH
  GROUP BY anchors.period
  ORDER BY anchors.period
known_divergence: Anchor dropping in inactive periods
