id: top_two_channels_by_revenue
catalog: storefront
request:
  metric: revenue
  date_range: {start_date: "2026-07-01", end_date: "2026-09-30"}
  dimensions: [channel]
  order_by:
    - {field: revenue, direction: desc}
  row_limit: 2
# The requested order, then every group key, NULL last; the limit keeps the first rows of that.
reference_sql: |
  SELECT channel, SUM(amount) AS revenue
  FROM storefront.fct_order_lines
  WHERE order_date >= DATE '2026-07-01' AND order_date < DATE '2026-10-01'
  GROUP BY channel
  ORDER BY revenue DESC NULLS LAST, channel NULLS LAST
  LIMIT 2
