id: net_revenue_by_year
catalog: tpch
request:
  metric: net_revenue
  date_range: {start_date: "1993-01-01", end_date: "1997-12-31"}
  time_grain: year
# net_revenue: extended price net of discount, by ship date.
reference_sql: |
  SELECT date_trunc('year', l_shipdate) AS period,
    SUM(l_extendedprice * (1 - l_discount)) AS net_revenue
  FROM tpch.lineitem
  WHERE l_shipdate >= DATE '1993-01-01' AND l_shipdate < DATE '1998-01-01'
  GROUP BY period
  ORDER BY period
