id: gmv_by_seller_tier
catalog: marketplace
request:
  metric: gmv
  date_range: {start_date: "2026-01-01", end_date: "2026-09-30"}
  dimensions: [seller__tier]
# One fact, one join: items to sellers. Items naming no seller land in the NULL tier.
reference_sql: |
  SELECT s.tier AS seller__tier, SUM(i.price) AS gmv
  FROM marketplace.fct_order_items i
  LEFT JOIN marketplace.dim_sellers s ON i.seller_id = s.seller_id
  WHERE i.sold_date >= DATE '2026-01-01' AND i.sold_date < DATE '2026-10-01'
  GROUP BY s.tier
  ORDER BY s.tier NULLS LAST
