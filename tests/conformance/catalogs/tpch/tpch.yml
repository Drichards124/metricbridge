# TPC-H, as generated by DuckDB's tpch extension. One-hop joins only: a metric reaches its own
# table's cuts and those one join away. Nation is declared but two joins from any fact.
semantic_models:
  - name: lineitems
    table: tpch.lineitem
    description: One row per order line.
    entities:
      - {name: sales_order, type: foreign, expr: l_orderkey}
      - {name: part, type: foreign, expr: l_partkey}
      - {name: supplier, type: foreign, expr: l_suppkey}
    dimensions:
      - {name: ship_date, type: time, time_granularity: day, is_partition: true, expr: l_shipdate}
      - {name: ship_mode, type: categorical, expr: l_shipmode}
      - {name: return_flag, type: categorical, expr: l_returnflag}
      - {name: line_status, type: categorical, expr: l_linestatus}
    measures:
      - {name: net_revenue, agg: sum, expr: "l_extendedprice * (1 - l_discount)"}
      - {name: quantity, agg: sum, expr: l_quantity}
      - {name: average_discount, agg: average, expr: l_discount}
      - {name: orders_shipped, agg: count_distinct, expr: l_orderkey}

  - name: orders
    table: tpch.orders
    description: One row per order.
    entities:
      - {name: sales_order, type: primary, expr: o_orderkey}
      - {name: customer, type: foreign, expr: o_custkey}
    dimensions:
      - {name: order_date, type: time, time_granularity: day, is_partition: true, expr: o_orderdate}
      - {name: order_status, type: categorical, expr: o_orderstatus}
      - {name: order_priority, type: categorical, expr: o_orderpriority}
    measures:
      - {name: order_count, agg: count, expr: o_orderkey}
      - {name: order_value, agg: sum, expr: o_totalprice}

  - name: parts
    table: tpch.part
    description: One row per part.
    entities:
      - {name: part, type: primary, expr: p_partkey}
    dimensions:
      - {name: brand, type: categorical, expr: p_brand}
      - {name: container, type: categorical, expr: p_container}
      - {name: part_type, type: categorical, expr: p_type}

  - name: suppliers
    table: tpch.supplier
    description: One row per supplier.
    entities:
      - {name: supplier, type: primary, expr: s_suppkey}
      - {name: nation, type: foreign, expr: s_nationkey}
    dimensions:
      - {name: supplier_name, type: categorical, expr: s_name}

  - name: customers
    table: tpch.customer
    description: One row per customer.
    entities:
      - {name: customer, type: primary, expr: c_custkey}
      - {name: nation, type: foreign, expr: c_nationkey}
    dimensions:
      - {name: market_segment, type: categorical, expr: c_mktsegment}

  - name: nations
    table: tpch.nation
    description: One row per nation.
    entities:
      - {name: nation, type: primary, expr: n_nationkey}
    dimensions:
      - {name: nation_name, type: categorical, expr: n_name}

metrics:
  - name: net_revenue
    type: simple
    measure: net_revenue
    description: Extended price net of discount, by ship date.
    tier: certified
    owner: finance
    domain: sales

  - name: quantity_shipped
    type: simple
    measure: quantity
    description: Units shipped, by ship date.
    tier: certified
    owner: operations
    domain: operations

  - name: average_discount
    type: simple
    measure: average_discount
    description: Mean discount per order line.
    tier: experimental
    owner: finance
    domain: sales

  - name: orders_shipped
    type: simple
    measure: orders_shipped
    description: Distinct orders with a line shipped.
    tier: certified
    owner: operations
    domain: operations

  - name: revenue_per_order
    type: ratio
    numerator: net_revenue
    denominator: orders_shipped
    description: Net revenue per distinct order shipped.
    tier: certified
    owner: finance
    domain: sales

  - name: order_count
    type: simple
    measure: order_count
    description: Orders placed, by order date.
    tier: certified
    owner: sales
    domain: sales

  - name: order_value
    type: simple
    measure: order_value
    description: Total price of orders placed, by order date.
    tier: certified
    owner: sales
    domain: sales
